apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-checker
  labels:
    app: url-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-checker
  template:
    metadata:
      labels:
        app: url-checker
    spec:
      containers:
        - name: url-checker
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/url-checker:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
